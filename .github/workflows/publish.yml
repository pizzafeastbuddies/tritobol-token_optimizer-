name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: ${{ github.event.release.html_url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match package version "
                  f"{version!r}; expected {expected_tag!r}"
              )
          PY
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify distributions contain no web app package
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel, = Path("dist").glob("*.whl")
          sdist, = Path("dist").glob("*.tar.gz")
          with zipfile.ZipFile(wheel) as archive:
              wheel_app_files = [
                  name for name in archive.namelist()
                  if name.startswith("tritobol_app/")
              ]
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_app_files = [
                  member.name for member in archive.getmembers()
                  if "/tritobol_app/" in f"/{member.name}"
              ]
          if wheel_app_files or sdist_app_files:
              raise SystemExit(
                  "Refusing to publish distributions containing the web app package: "
                  f"wheel={wheel_app_files}, sdist={sdist_app_files}"
              )
          PY
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
